  templates:
  - uuid: 062e9b53e601427db62d21558c9b5d99
    template: Ubiquiti UniFi API
    name: Ubiquiti UniFi API
    description: |
      Zabbix UniFi API monitoring template for UniFi Site Manager API v1 (https://developer.ui.com/site-manager/v1.0.0/gettingstarted)

      Template available at https://github.com/kairandles/zabbix-unifi
    groups:
    - name: Templates
    items:
    - uuid: bcd77fc83418401984ba49a218a4a464
      name: 'Unifi API Raw: Hosts'
      type: HTTP_AGENT
      key: unifi.api.hosts
      delay: 1m
      history: '0'
      value_type: TEXT
      trends: '0'
      url: https://api.ui.com/v1/hosts
      timeout: 15s
      headers:
      - name: Accept
        value: application/json
      - name: x-api-key
        value: '{$APIKEY}'
      tags:
      - tag: component
        value: raw
    - uuid: f6a5b7efa43e467db3ce58f2d67280f6
      name: 'Unifi API Raw: Devices'
      type: HTTP_AGENT
      key: unifi.api.devices
      delay: 1m
      history: '0'
      value_type: TEXT
      trends: '0'
      url: https://api.ui.com/v1/devices
      timeout: 15s
      headers:
      - name: Accept
        value: application/json
      - name: x-api-key
        value: '{$APIKEY}'
      tags:
      - tag: component
        value: raw
    - uuid: c4d2c6f96b2a4a859c07bf58f96b8287
      name: 'Unifi SD-WAN Raw: Configs List'
      type: HTTP_AGENT
      key: unifi.sdwan.configs
      delay: 1m
      history: '0'
      value_type: TEXT
      trends: '0'
      url: https://api.ui.com/v1/sd-wan-configs
      timeout: 15s
      headers:
      - name: Accept
        value: application/json
      - name: x-api-key
        value: '{$APIKEY}'
      tags:
      - tag: component
        value: raw
    - uuid: 020a80b4e4db471da397db6f152651d7
      name: 'Unifi API Raw: Sites'
      type: HTTP_AGENT
      key: unifi.api.sites
      delay: 1m
      history: '0'
      value_type: TEXT
      trends: '0'
      url: https://api.ui.com/v1/sites
      timeout: 15s
      headers:
      - name: Accept
        value: application/json
      - name: x-api-key
        value: '{$APIKEY}'
      tags:
      - tag: component
        value: raw
    discovery_rules:
    - uuid: e29c11c782014aa6a22fd7991f6d4ef4
      name: Discover Unifi Hosts
      type: DEPENDENT
      key: unifi.api.discover.hosts
      delay: '0'
      host_prototypes:
      - uuid: 1cbf4d69cdbb43959561a1fb0ef20993
        host: '{#HARDWAREID}'
        name: '{#NAME}'
        inventory_mode: AUTOMATIC
        group_links:
        - group:
            name: Unifi Site Hosts
        - group:
            name: Type:UnifiNetworkDevice
        group_prototypes:
        - name: 'Site:{#SITENAME}'
        templates:
        - name: Ubiquiti UniFi API Host
        macros:
        - macro: '{$HOSTID}'
          value: '{#HOSTID}'
          description: Unifi API Host ID
        - macro: '{$SITENAME}'
          value: '{#SITENAME}'
          description: Site name derived from hostname - used for host group assignment
        - macro: '{$UNIFI.LOCAL.IP}'
          value: '{#LOCALIP}'
          description: Local management IP of this console (e.g. 10.183.200.1)
        - macro: '{$UNIFI.USERNAME}'
          value: ''
          description: UniFi local controller read-only username
        - macro: '{$UNIFI.PASSWORD}'
          value: ''
          description: UniFi local controller password
          type: SECRET_TEXT
        custom_interfaces: 'YES'
        interfaces:
        - ip: '{#LOCALIP}'
      master_item:
        key: unifi.api.hosts
      lld_macro_paths:
      - lld_macro: '{#HARDWAREID}'
        path: $..hardwareId.first()
      - lld_macro: '{#HOSTID}'
        path: $..id.first()
      - lld_macro: '{#NAME}'
        path: $..reportedState.hostname.first()
      - lld_macro: '{#LOCALIP}'
        path: $.localIp
      - lld_macro: '{#SITENAME}'
        path: $.siteName
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[*]
      - type: JAVASCRIPT
        parameters:
        - |
          var obj = JSON.parse(value);
          for (var i = 0; i < Object.keys(obj).length; i++) {
              var rs = obj[i].reportedState || {};
              var addrs = rs.ipAddrs || [];
              var localIp = '';
              var prefixes = ['10.', '192.168.', '172.'];
              for (var p = 0; p < prefixes.length && !localIp; p++) {
                  for (var j = 0; j < addrs.length; j++) {
                      if (addrs[j].indexOf(prefixes[p]) === 0) {
                          localIp = addrs[j];
                          break;
                      }
                  }
              }
              obj[i].localIp = localIp;
              // Derive site name from hostname: "Randles-Family-SC-186" -> "Randles-Family"
              var hostname = (rs.hostname || '');
              var siteName = hostname.replace(/-SC-[0-9]+$/, '').replace(/-CGU$/, '');
              obj[i].siteName = siteName || hostname;
              delete obj[i].reportedState.controllers;
              delete obj[i].features;
              delete obj[i].userData;
          }
          return JSON.stringify(obj);
    - uuid: d7997156360b41d7af58cde5af9b4be0
      name: Discover SD-WAN Configs
      type: DEPENDENT
      key: unifi.sdwan.discover.configs
      delay: '0'
      host_prototypes:
      - uuid: 0a5668f871664708bfbcbbaaeaf48ea1
        host: '{#SDWANID}'
        name: '{#SDWANNAME}'
        group_links:
        - group:
            name: Unifi Site Hosts
        - group:
            name: Type:UnifiNetworkDevice
        templates:
        - name: Ubiquiti UniFi SD-WAN
        macros:
        - macro: '{$SDWANID}'
          value: '{#SDWANID}'
          description: SD-WAN Config ID
      master_item:
        key: unifi.sdwan.configs
      lld_macro_paths:
      - lld_macro: '{#SDWANID}'
        path: $.id
      - lld_macro: '{#SDWANNAME}'
        path: $.name
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[*]
    macros:
    - macro: '{$APIKEY}'
      type: SECRET_TEXT
      description: API Key to access api.ui.com
    - macro: '{$WAN_UPTIME_WARN}'
      value: '99'
      description: 'WAN uptime % below which AVERAGE alert fires (default: 99%)'
    - macro: '{$WAN_UPTIME_HIGH}'
      value: '95'
      description: 'WAN uptime % below which DISASTER alert fires (default: 95%)'
    - macro: '{$UNIFI.WAN.LATENCY.WARN}'
      value: '150'
      description: 'Latency threshold in ms for WARNING alert. Raise to 200+ for Central America sites where 60-80ms to UK
        is normal (default: 150)'
  - uuid: d8cf0c6a2d19418b8e7c2adcb9c2b4c1
    template: Ubiquiti UniFi API Host
    name: Ubiquiti UniFi API Host
    description: |
      Zabbix UniFi API monitoring template for UniFi Site Manager API v1 (https://developer.ui.com/site-manager/v1.0.0/gettingstarted). Used by hosts discovered in Ubiquiti UniFi API.

      Template available at https://github.com/StreetKidsDirect/UnifiAPI-Zabbix
