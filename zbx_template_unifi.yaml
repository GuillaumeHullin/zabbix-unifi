        name: '{HOST.NAME} memory high: {ITEM.LASTVALUE} (threshold: {$UNIFI.MEM.USAGE.WARN}%)'
        priority: WARNING
        description: Device memory usage is elevated above the warning threshold ({$UNIFI.MEM.USAGE.WARN}%). Monitor for further increases. A reboot may clear leaked
          memory if the issue persists without a clear cause.
    - uuid: a1b2c3d4e5f64a7b8c9d0e1f2a3b4c5d
      name: Uptime
      type: DEPENDENT
      key: unifi.ups.uptime
      delay: '0'
