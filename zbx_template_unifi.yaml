    - uuid: cb48be19da2342ccb5b1ecb06a6d54b4
      name: Disconnected Tunnels
      type: DEPENDENT
      key: unifi.sdwan.disconnectedTunnels
      delay: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value).data;
          var count = 0;
          var nodes = (data.hubs || []).concat(data.spokes || []);
          for (var i = 0; i < nodes.length; i++) {
              var conns = nodes[i].connections || [];
              for (var j = 0; j < conns.length; j++) {
                  var tunnels = conns[j].tunnels || [];
                  for (var k = 0; k < tunnels.length; k++) {
                      if (tunnels[k].status !== 'connected') count++;
                  }
              }
          }
          return count;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.sdwan.status
      tags:
      - tag: component
        value: sdwan
      triggers:
      - uuid: b773d6bd04274e2ea29c3bdc00f90a16
        expression: last(/Ubiquiti UniFi SD-WAN/unifi.sdwan.disconnectedTunnels)>0
        name: 'SD-WAN {HOST.NAME}: {ITEM.LASTVALUE} tunnel(s) disconnected'
        priority: HIGH
        description: 'One or more SD-WAN tunnels are not connected but at least one path likely remains. Inter-site
          traffic may be degraded. Check spoke WAN interface triggers to identify which circuit dropped. Escalates to
          DISASTER if a spoke loses all tunnels (isolated spokes trigger).'
    - uuid: c89a413789224d6a8d3886d5fb260a07
      name: Isolated Spokes
      type: DEPENDENT
      key: unifi.sdwan.isolatedSpokes
      delay: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value).data;
          var count = 0;
          var spokes = data.spokes || [];
          for (var i = 0; i < spokes.length; i++) {
              var conns = spokes[i].connections || [];
              var connected = 0;
              for (var j = 0; j < conns.length; j++) {
                  var tunnels = conns[j].tunnels || [];
                  for (var k = 0; k < tunnels.length; k++) {
                      if (tunnels[k].status === 'connected') connected++;
                  }
              }
              if (connected === 0) count++;
          }
          return count;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.sdwan.status
      tags:
      - tag: component
        value: sdwan
      triggers:
      - uuid: b6484d60b85f4173904f06ddc58b9004
        expression: last(/Ubiquiti UniFi SD-WAN/unifi.sdwan.isolatedSpokes)>0
        name: 'SD-WAN {HOST.NAME}: {ITEM.LASTVALUE} spoke(s) completely isolated - all tunnels down'
        priority: DISASTER
        description: 'One or more spoke sites have lost every SD-WAN tunnel. The spoke is fully cut off from all hub sites.
          A single WAN going down on a dual-WAN spoke would only drop one tunnel (leaving the other active) and would
          not fire this alarm - so if this fires, ALL WANs on that spoke are unreachable. Check the spoke site WAN
          triggers and ISP status immediately.'
    - uuid: 90fe35b7e3cc4ae29665deb1296cdc42
      name: Disconnected Hubs
      type: DEPENDENT
      key: unifi.sdwan.disconnectedHubs
      delay: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value).data;
          var hubs = data.hubs || [];
          var spokes = data.spokes || [];
          var count = 0;
          for (var i = 0; i < hubs.length; i++) {
              var hubId = hubs[i].id;
              var hasConnectedSpoke = false;
              for (var j = 0; j < spokes.length; j++) {
                  var conns = spokes[j].connections || [];
                  for (var k = 0; k < conns.length; k++) {
                      if (conns[k].hubId !== hubId) continue;
                      var tunnels = conns[k].tunnels || [];
                      for (var m = 0; m < tunnels.length; m++) {
                          if (tunnels[m].status === 'connected') { hasConnectedSpoke = true; break; }
                      }
                      if (hasConnectedSpoke) break;
                  }
                  if (hasConnectedSpoke) break;
              }
              if (!hasConnectedSpoke) count++;
          }
          return count;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.sdwan.status
      tags:
      - tag: component
        value: sdwan
      triggers:
      - uuid: cc1d8c26e39d4363a58d9f906245d1d3
        expression: last(/Ubiquiti UniFi SD-WAN/unifi.sdwan.disconnectedHubs)>0
        name: 'SD-WAN {HOST.NAME}: {ITEM.LASTVALUE} hub(s) have no active spoke connections'
        priority: DISASTER
        description: 'A hub site has lost all SD-WAN spoke connections. No spoke sites can reach this hub, meaning
          all inter-site traffic routed through it is down. Check the hub gateway WAN link and its cloud connectivity.
          If the hub WAN is up, check for SD-WAN config or certificate issues in UniFi Site Manager.'
    - uuid: a62f0d0ccd7646ab9543281a5ade0469
      name: Hub WAN Internet Issues
      type: DEPENDENT
      key: unifi.sdwan.hubWanIssues
      delay: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value).data;
          var count = 0;
          var hubs = data.hubs || [];
          for (var i = 0; i < hubs.length; i++) {
              var p = hubs[i].primaryWanStatus || {};
              var s = hubs[i].secondaryWanStatus || {};
              if (p.internetIssues && p.internetIssues.length > 0) count++;
              if (s.internetIssues && s.internetIssues.length > 0) count++;
          }
          return count;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.sdwan.status
      tags:
      - tag: component
        value: sdwan
      triggers:
      - uuid: de8109c1b4c54bf786243567ef10d657
        expression: last(/Ubiquiti UniFi SD-WAN/unifi.sdwan.hubWanIssues)>0
        name: 'SD-WAN {HOST.NAME}: hub site WAN issues detected'
        priority: HIGH
        description: A hub site is reporting WAN internet issues. This may affect all spoke sites tunnelling through it.
          Check hub gateway WAN interface triggers and ISP status.
    - uuid: 3296a4ff32da45468da7e8efa0441c2c
      name: Spoke WAN Internet Issues
      type: DEPENDENT
      key: unifi.sdwan.spokeWanIssues
      delay: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value).data;
          var count = 0;
          var spokes = data.spokes || [];
          for (var i = 0; i < spokes.length; i++) {
              var p = spokes[i].primaryWanStatus || {};
              var s = spokes[i].secondaryWanStatus || {};
              if (p.internetIssues && p.internetIssues.length > 0) count++;
              if (s.internetIssues && s.internetIssues.length > 0) count++;
          }
          return count;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.sdwan.status
      tags:
      - tag: component
        value: sdwan
      triggers:
      - uuid: a2383699354f40e2b4b2b32747cca9d0
        expression: last(/Ubiquiti UniFi SD-WAN/unifi.sdwan.spokeWanIssues)>0
        name: 'SD-WAN {HOST.NAME}: spoke site WAN issues detected'
        priority: HIGH
        description: A spoke site is reporting WAN internet issues. Inter-site connectivity may be degraded. Check the 
          site-level WAN downtime triggers to identify which spoke and which circuit is affected.
    macros:
    - macro: '{$APIKEY}'
      type: SECRET_TEXT
      description: API Key to access api.ui.com
    - macro: '{$SDWANID}'
      description: SD-WAN Config ID - set automatically by host prototype discovery
  - uuid: 55b1c6055ff747ddb9b37eab60704ee2
    template: Ubiquiti UniFi Device
    name: Ubiquiti UniFi Device
    description: |
      Applied to individual UniFi device hosts discovered by Ubiquiti UniFi API Host.
      Monitors device status, firmware, version, uptime, and IP via cloud API.
      Macros {$HOSTID} and {$DEVICEID} are set automatically by the discovering gateway's host prototype.

      Template available at https://github.com/StreetKidsDirect/UnifiAPI-Zabbix
    groups:
    - name: Templates
    items:
    - uuid: a71c4e104be5442d9fb649dec7fa61c3
      name: 'Unifi API Raw: Device'
      type: HTTP_AGENT
      key: unifi.api.device.raw
      delay: 1m
      history: '0'
      value_type: TEXT
      trends: '0'
      url: https://api.ui.com/v1/devices?hostId={$HOSTID}
      timeout: 15s
      headers:
      - name: Accept
        value: application/json
      - name: x-api-key
        value: '{$APIKEY}'
      tags:
      - tag: component
        value: raw
    - uuid: 30bcef8871434615840e70993ec0078d
      name: Status
      type: DEPENDENT
      key: unifi.api.device.status
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var id = '{$DEVICEID}';
          var hostId = '{$HOSTID}';
          for (var i = 0; i < d.data.length; i++) {
              if (d.data[i].hostId !== hostId) continue;
              var devs = d.data[i].devices || [];
              for (var j = 0; j < devs.length; j++) {
                  if (devs[j].id === id) return devs[j].status || 'unknown';
              }
          }
          return 'unknown';
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.api.device.raw
      tags:
      - tag: component
        value: device
      triggers:
      - uuid: f7c0cd7ab5e1468a82727ab23d407f9c
        expression: find(/Ubiquiti UniFi Device/unifi.api.device.status,#1,"regexp","offline")=1
        name: '{HOST.NAME} is offline'
        priority: HIGH
        description: This UniFi device has gone offline. Check physical power, PoE on the uplink switch port, and any
          upstream switch. If this is an AP, check nearby clients for connectivity loss.
    - uuid: c1b1a32e7be247d689ac64750071cd79
      name: Firmware Status
      type: DEPENDENT
      key: unifi.api.device.firmwareStatus
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var id = '{$DEVICEID}';
          var hostId = '{$HOSTID}';
          for (var i = 0; i < d.data.length; i++) {
              if (d.data[i].hostId !== hostId) continue;
              var devs = d.data[i].devices || [];
              for (var j = 0; j < devs.length; j++) {
                  if (devs[j].id === id) return devs[j].firmwareStatus || 'unknown';
              }
          }
          return 'unknown';
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.device.raw
      tags:
      - tag: component
        value: device
      triggers:
      - uuid: d25a351ab10944f9af7d9179e9261487
        expression: find(/Ubiquiti UniFi Device/unifi.api.device.firmwareStatus,#1,"regexp","^upToDate$")<>1 and 
          find(/Ubiquiti UniFi Device/unifi.api.device.firmwareStatus,#1,"regexp","offline")<>1 and find(/Ubiquiti UniFi
          Device/unifi.api.device.firmwareStatus,#1,"regexp","unknown")<>1
        name: 'Firmware update available for {HOST.NAME}: {ITEM.LASTVALUE}'
        priority: INFO
        description: This device has a firmware update available or is in an unexpected firmware state. Schedule an 
          update via the UniFi dashboard during a maintenance window.
    - uuid: 65054c4effea4e02b50414f3404bfc13
      name: Firmware Update Version
      type: DEPENDENT
      key: unifi.api.device.updateAvailable
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var id = '{$DEVICEID}';
          var hostId = '{$HOSTID}';
          for (var i = 0; i < d.data.length; i++) {
              if (d.data[i].hostId !== hostId) continue;
              var devs = d.data[i].devices || [];
              for (var j = 0; j < devs.length; j++) {
                  if (devs[j].id === id) return devs[j].updateAvailable || 'none';
              }
          }
          return 'none';
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.device.raw
      tags:
      - tag: component
        value: device
    - uuid: aa75df89a52341f6bee681aebd3cd099
      name: Version
      type: DEPENDENT
      key: unifi.api.device.version
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var id = '{$DEVICEID}';
          var hostId = '{$HOSTID}';
          for (var i = 0; i < d.data.length; i++) {
              if (d.data[i].hostId !== hostId) continue;
              var devs = d.data[i].devices || [];
              for (var j = 0; j < devs.length; j++) {
                  if (devs[j].id === id) return devs[j].version || '';
              }
          }
          return '';
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.device.raw
      tags:
      - tag: component
        value: device
      triggers:
      - uuid: ba3a651d5a364058935231888f1bed91
        expression: change(/Ubiquiti UniFi Device/unifi.api.device.version)=1
        name: '{HOST.NAME} firmware version changed to {ITEM.LASTVALUE}'
        priority: INFO
        description: Device firmware version changed, indicating an update was applied. Monitor for stability and check 
          the device is still online.
        manual_close: 'YES'
    - uuid: ff3bb93f227a48c6a658ab79d6f9c503
      name: IP Address
      type: DEPENDENT
      key: unifi.api.device.ip
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var id = '{$DEVICEID}';
          var hostId = '{$HOSTID}';
          for (var i = 0; i < d.data.length; i++) {
              if (d.data[i].hostId !== hostId) continue;
              var devs = d.data[i].devices || [];
              for (var j = 0; j < devs.length; j++) {
                  if (devs[j].id === id) return devs[j].ip || '';
              }
          }
          return '';
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.device.raw
      tags:
      - tag: component
        value: device
    - uuid: dc27ab45d5ec4f8ebc8586593c59187a
      name: Startup Time
      type: DEPENDENT
      key: unifi.api.device.startupTime
      delay: '0'
      history: 90d
      trends: '0'
      units: unixtime
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var id = '{$DEVICEID}';
          var hostId = '{$HOSTID}';
          for (var i = 0; i < d.data.length; i++) {
              if (d.data[i].hostId !== hostId) continue;
              var devs = d.data[i].devices || [];
              for (var j = 0; j < devs.length; j++) {
                  if (devs[j].id === id) {
                      var t = devs[j].startupTime;
                      if (!t) return 0;
                      return Math.floor(new Date(t).getTime() / 1000);
                  }
              }
          }
          return 0;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.device.raw
      tags:
      - tag: component
        value: device
      triggers:
      - uuid: 410950363a674b16a8a9644843268743
        expression: change(/Ubiquiti UniFi Device/unifi.api.device.startupTime)=1 and last(/Ubiquiti UniFi
          Device/unifi.api.device.startupTime)>0 and abs(last(/Ubiquiti UniFi Device/unifi.api.device.startupTime)-last(/Ubiquiti UniFi Device/unifi.api.device.startupTime,#2))>300
        name: '{HOST.NAME} has rebooted'
        priority: INFO
        description: The startup time changed, indicating the device rebooted. If unscheduled, check for power issues or
          firmware updates.
        manual_close: 'YES'
    - uuid: 2ddebb7e54754e919535dad774226e66
      name: Managed State
      type: DEPENDENT
      key: unifi.api.device.isManaged
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var id = '{$DEVICEID}';
          var hostId = '{$HOSTID}';
          for (var i = 0; i < d.data.length; i++) {
              if (d.data[i].hostId !== hostId) continue;
              var devs = d.data[i].devices || [];
              for (var j = 0; j < devs.length; j++) {
                  if (devs[j].id === id) return String(devs[j].isManaged);
              }
          }
          return 'unknown';
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 10m
      master_item:
        key: unifi.api.device.raw
      tags:
      - tag: component
        value: device
      triggers:
      - uuid: 11148652ed2741e883be851fae66bf24
        expression: find(/Ubiquiti UniFi Device/unifi.api.device.isManaged,#1,"regexp","false")=1
        name: '{HOST.NAME} is no longer managed'
        priority: AVERAGE
        description: This device has been removed from management. It will not receive configuration or firmware updates
          and will not appear in the UniFi dashboard. Re-adopt the device or remove it if decommissioned.
    macros:
    - macro: '{$HOSTID}'
      description: Parent gateway host ID - set automatically by host prototype discovery
    - macro: '{$DEVICEID}'
      description: Device MAC/ID - set automatically by host prototype discovery
    - macro: '{$DEVICENAME}'
      description: Device display name - set automatically by host prototype discovery
    - macro: '{$MODEL}'
      description: Device model - set automatically by host prototype discovery
    valuemaps:
    - uuid: 5995b8e5c09846538ef9b06abfa2ca6f
      name: Service state
      mappings:
      - value: '0'
        newvalue: Down
      - value: '1'
        newvalue: Up
  - uuid: 226f2a3ed5884856b08373c9caff1bdf
    template: Ubiquiti UniFi UAP
    name: Ubiquiti UniFi UAP
    description: Local controller polling for UniFi Access Points. Applied alongside Ubiquiti UniFi Device by host 
      prototype discovery.
    groups:
    - name: Templates
    items:
    - uuid: 0acd06e04d3c44be811b23a2e7b44d74
      name: UAP Device Raw
      type: HTTP_AGENT
      key: unifi.uap.device
      delay: 3m
      history: '0'
      value_type: TEXT
      trends: '0'
      url: https://{$UNIFI.LOCAL.IP}/{$UNIFI.API.AUTH.URI}
      post_type: JSON
      posts: '{"username":"{$UNIFI.USERNAME}","password":"{$UNIFI.PASSWORD}"}'
      request_method: POST
      retrieve_mode: HEADERS
      timeout: 10s
      verify_peer: 'NO'
      verify_host: 'NO'
      preprocessing:
      - type: REGEX
        parameters:
        - '{$UNIFI.API.AUTH.TOKEN}=([^;]+);'
        - \1
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              var mac = '{$DEVICEMAC}';
              var url = 'https://{$UNIFI.LOCAL.IP}/{$UNIFI.API.URI}/device';
              var req = new HttpRequest();
              req.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + value);
              var resp = req.get(url);
              if (req.getStatus() !== 200) throw 'HTTP ' + req.getStatus();
              var d = JSON.parse(resp);
              var macNorm = mac.replace(/:/g,'').toLowerCase(); var dev = (d.data || []).filter(function(x) { return x.mac && x.mac.replace(/:/g,'').toLowerCase() === macNorm; });
              return JSON.stringify({data: dev});
          } catch(e) {
              Zabbix.log(4, '[UniFi UAP] ' + e);
              return '{"data":[]}';
          }
      tags:
      - tag: component
        value: raw
    - uuid: c08f7dd9bd524092819cedda383b67d3
      name: State
      type: DEPENDENT
      key: unifi.uap.state
      delay: '0'
      history: 90d
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].state
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
