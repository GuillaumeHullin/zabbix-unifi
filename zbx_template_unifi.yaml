        parameters:
        - $.data.ipAddress
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
    - uuid: 5c86249852e3457d9a6484a46ec8d589
      name: Hardware Serial Number
      type: DEPENDENT
      key: unifi.api.host.serial
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      inventory_link: SERIALNO_A
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.hardware.serialno.first()
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
    - uuid: f7eb1f5a815d437c8e02217a58cafab2
      name: Unifi Stack status
      type: DEPENDENT
      key: unifi.api.host.stack
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.isStacked.first()
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
    - uuid: ccf31a17c95f4dba8b9a0bdd0d0bf6af
      name: Unadopted UnifiOS devices
      type: DEPENDENT
      key: unifi.api.host.unadoptedUnifiOSDevices
      delay: '0'
      units: devices
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.unadoptedUnifiOSDevices.first()
      - type: REGEX
        parameters:
        - ^\[(.*)\]$
        - \1
      - type: JSONPATH
        parameters:
        - $.totalCount
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
      triggers:
      - uuid: 42366384773f40c18b3856fb5213bbe1
        expression: last(/Ubiquiti UniFi API Host/unifi.api.host.unadoptedUnifiOSDevices)>0
        name: '{ITEM.LASTVALUE} unadopted UnifiOS device(s) found on this console'
        priority: WARNING
        description: UnifiOS devices attached to this console are in an unadopted state. They will not be managed or 
          monitored until adopted. Check the UniFi dashboard under Devices for devices showing as "Pending Adoption".
    - uuid: 85013a2d5b314fe59dcf140befd89d24
      name: UniFiOS Version
      type: DEPENDENT
      key: unifi.api.host.version
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      inventory_link: SOFTWARE
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.version.first()
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
      triggers:
      - uuid: afc59094460549a9840d683f8173cc57
        expression: change(/Ubiquiti UniFi API Host/unifi.api.host.version)=1
        name: UniFiOS version changed to {ITEM.LASTVALUE}
        priority: INFO
        description: The UniFiOS firmware version on this console has changed. This is expected after a scheduled 
          update. Verify stability in the hours following an update and confirm all controllers are still running.
        manual_close: 'YES'
    - uuid: 75db7d05e7da4a06920b3a348e9be5da
      name: Firmware Update Available
      type: DEPENDENT
      key: unifi.api.host.firmwareUpdate
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.firmwareUpdate.latestAvailableVersion.first()
        error_handler: CUSTOM_VALUE
        error_handler_params: none
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
      triggers:
      - uuid: 3f397f58244e47f4ae5aa8762932f7bc
        expression: find(/Ubiquiti UniFi API Host/unifi.api.host.firmwareUpdate,#1,"regexp","^(none|null)$")<>1
        name: 'UniFiOS firmware update available: {ITEM.LASTVALUE}'
        priority: INFO
        description: A new UniFiOS firmware version is available for this console. Schedule an update during a 
          maintenance window. Updates typically take 5-10 minutes and involve a brief reboot.
    - uuid: 9ec872a7b7dc4b089db03e16379cecea
      name: Connection State
      type: DEPENDENT
      key: unifi.api.host.state
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.state.first()
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
      triggers:
      - uuid: 7da30f54173e492eb6c067227cbacd7f
        expression: find(/Ubiquiti UniFi API Host/unifi.api.host.state,#1,"regexp","connected")<>1
        name: 'Console lost cloud connectivity - state: {ITEM.LASTVALUE}'
        priority: DISASTER
        description: This UniFi console is no longer connected to the Ubiquiti cloud. Local network operations continue,
          but cloud management, remote access, and SD-WAN signalling may be affected. Check the console WAN and the 
          site-level internet triggers. If the site WAN is up, check the console directly.
    - uuid: 9908bbc6f93c4e02b2680170147ecc5a
      name: Device State
      type: DEPENDENT
      key: unifi.api.host.deviceState
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.deviceState.first()
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
      triggers:
      - uuid: 73df395c08654c54baf39346cbb610f3
        expression: change(/Ubiquiti UniFi API Host/unifi.api.host.deviceState)=1
        name: Console device state changed to {ITEM.LASTVALUE}
        priority: INFO
        description: The reported device state for this console has changed (e.g. rebooting, updating, setup). No action
          needed unless combined with a connection state alert.
        manual_close: 'YES'
    - uuid: b17ff1049e0245c892e6b52b82a8b358
      name: Last Connection State Change
      type: DEPENDENT
      key: unifi.api.host.lastConnectionStateChange
      delay: '0'
      history: 90d
      trends: '0'
      units: unixtime
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..lastConnectionStateChange.first()
      - type: JAVASCRIPT
        parameters:
        - |
          var date = new Date(value);
          return Math.floor(date.getTime() / 1000);
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
    - uuid: 286b496f79194c1592a1704e29543c52
      name: Release Channel
      type: DEPENDENT
      key: unifi.api.host.releaseChannel
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.releaseChannel.first()
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
      triggers:
      - uuid: 91e26ced6f284e409d83a15333aa99eb
        expression: find(/Ubiquiti UniFi API Host/unifi.api.host.releaseChannel,#1,"regexp","release")<>1
        name: 'Console on non-production release channel: {ITEM.LASTVALUE}'
        priority: INFO
        description: This console is enrolled in a non-release firmware channel (e.g. release-candidate or beta). It 
          will receive pre-release firmware that may be less stable. Only intentional for test environments.
        manual_close: 'YES'
    - uuid: 8b6e9be512c0420f874f752656a1f028
      name: Cloud System Log State
      type: DEPENDENT
      key: unifi.api.host.cloudSystemLogState
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.cloudSystemLogState.first()
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
      triggers:
      - uuid: d089ee460f204a218bef1c7b5ee5a7d0
        expression: find(/Ubiquiti UniFi API Host/unifi.api.host.cloudSystemLogState,#1,"regexp","enabled")<>1
        name: 'Cloud system logging is not enabled (current: {ITEM.LASTVALUE})'
        priority: INFO
        description: Cloud system log forwarding is disabled on this console. System logs will not be forwarded to 
          Ubiquiti cloud. This is low-impact but may hinder remote support diagnostics.
        manual_close: 'YES'
    - uuid: 1a3953b9b897468d872f6f11561df9bb
      name: 'Unifi API Raw: Sites'
      type: HTTP_AGENT
      key: unifi.api.host.sites
      delay: 1m
      history: '0'
