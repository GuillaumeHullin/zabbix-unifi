    discovery_rules:
    - uuid: 01fd3006f5d34094971e7a81c0c09cc3
      name: Discover RPS Ports
      type: DEPENDENT
      key: unifi.rps.port.discovery
      delay: '0'
      filter:
        conditions:
        - macro: '{#RPSPORTNAME}'
          value: ^Port [0-9]+$
          operator: NOT_MATCHES_REGEX
          formulaid: A
      item_prototypes:
      - uuid: 9b2bfb9900374eba8985a2e89f7c3566
        name: RPS Port {#RPSPORTID} ({#RPSPORTNAME}) State
        type: DEPENDENT
        key: unifi.rps.port.state[{#RPSPORTID}]
        delay: '0'
        history: 90d
        value_type: TEXT
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.data[0].rps.rps_port_table[?(@.port_idx=={#RPSPORTID})].port_state.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: disconnected
        master_item:
          key: unifi.rps.device
        tags:
        - tag: component
          value: rps-port
        - tag: port
          value: '{#RPSPORTID}'
        trigger_prototypes:
        - uuid: 3d6d563f115c4e06b5d1cfb96450dce1
          expression: find(/Ubiquiti UniFi RPS/unifi.rps.port.state[{#RPSPORTID}],#1,"regexp","active")=1
          name: '{HOST.NAME} RPS port {#RPSPORTID} ({#RPSPORTNAME}) ACTIVE - primary PSU failed on connected device'
          priority: DISASTER
          description: The RPS is actively delivering power to this port because the connected device lost its primary 
            PSU.
          dependencies:
          - name: '{HOST.NAME} offline - not seen by local controller'
            expression: min(/Ubiquiti UniFi RPS/unifi.rps.state,#5)<>1
      - uuid: 8bc2cde8e674465aa2040d1404fa90e2
        name: RPS Port {#RPSPORTID} ({#RPSPORTNAME}) Delivering
        type: DEPENDENT
        key: unifi.rps.port.delivering[{#RPSPORTID}]
        delay: '0'
        history: 90d
        value_type: TEXT
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.data[0].rps.rps_port_table[?(@.port_idx=={#RPSPORTID})].power_delivering.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: 'false'
        master_item:
          key: unifi.rps.device
        tags:
        - tag: component
          value: rps-port
        - tag: port
          value: '{#RPSPORTID}'
        trigger_prototypes: []
      - uuid: d7c9f877ca5544839250def9cdcbf881
        name: RPS Port {#RPSPORTID} ({#RPSPORTNAME}) Up
        type: DEPENDENT
        key: unifi.rps.port.up[{#RPSPORTID}]
        delay: '0'
        history: 90d
        value_type: TEXT
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.data[0].rps.rps_port_table[?(@.port_idx=={#RPSPORTID})].up.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: 'false'
        master_item:
          key: unifi.rps.device
        tags:
        - tag: component
          value: rps-port
        - tag: port
          value: '{#RPSPORTID}'
        trigger_prototypes:
        - uuid: e1f2a3b4c5d64e7f8a9b0c1d2e3f4a5c
          expression: find(/Ubiquiti UniFi RPS/unifi.rps.port.up[{#RPSPORTID}],#1,"regexp","false")=1
          name: '{HOST.NAME} RPS port {#RPSPORTID} ({#RPSPORTNAME}) disconnected'
          priority: WARNING
          dependencies:
          - name: '{HOST.NAME} offline - not seen by local controller'
            expression: min(/Ubiquiti UniFi RPS/unifi.rps.state,#5)<>1
          description: RPS port {#RPSPORTID} ({#RPSPORTNAME}) is no longer connected. The device on this port has no 
            redundant power supply protection - if its primary PSU now fails, it will lose power with no failover. Check
            the RPS cable connection from the RPS unit to the device.
      - uuid: f2a3b4c5d6e74f8b9c0d1e2f3a4b5c6d
        name: RPS Port {#RPSPORTID} ({#RPSPORTNAME}) 12V Power
        type: DEPENDENT
        key: unifi.rps.port.power.12v[{#RPSPORTID}]
        delay: '0'
        history: 90d
        value_type: FLOAT
        units: W
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.data[0].rps.rps_port_table[?(@.port_idx=={#RPSPORTID})].power_12v_power.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        master_item:
          key: unifi.rps.device
        tags:
        - tag: component
          value: rps-port
        - tag: port
          value: '{#RPSPORTID}'
        trigger_prototypes: []
      - uuid: d8dd1ca98ae1487d945f6198f8a3bb1a
        name: RPS Port {#RPSPORTID} ({#RPSPORTNAME}) 54V Power
        type: DEPENDENT
        key: unifi.rps.port.power.54v[{#RPSPORTID}]
        delay: '0'
        history: 90d
        value_type: FLOAT
        units: W
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.data[0].rps.rps_port_table[?(@.port_idx=={#RPSPORTID})].power_54v_power.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        master_item:
          key: unifi.rps.device
        tags:
        - tag: component
          value: rps-port
        - tag: port
          value: '{#RPSPORTID}'
        trigger_prototypes: []
      master_item:
        key: unifi.rps.device
      lld_macro_paths:
      - lld_macro: '{#RPSPORTID}'
        path: $.port_idx
      - lld_macro: '{#RPSPORTNAME}'
        path: $.name
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].rps.rps_port_table
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
    macros:
    - macro: '{$DEVICEID}'
      description: Device MAC - set by host prototype
    - macro: '{$UNIFI.LOCAL.IP}'
      description: Local controller IP - set by host prototype
    - macro: '{$UNIFI.USERNAME}'
      description: Local controller username
    - macro: '{$UNIFI.PASSWORD}'
      type: SECRET_TEXT
      description: Local controller password
    - macro: '{$UNIFI.API.AUTH.URI}'
      value: api/auth/login
    - macro: '{$UNIFI.API.AUTH.TOKEN}'
      value: TOKEN
    - macro: '{$UNIFI.API.URI}'
      value: proxy/network/api/s/default/stat
    - macro: '{$UNIFI.CPU.USAGE.WARN}'
      value: '80'
      description: CPU usage warning threshold (%).
    - macro: '{$UNIFI.CPU.USAGE.HIGH}'
      value: '90'
      description: CPU usage high threshold (%).
    - macro: '{$UNIFI.MEM.USAGE.WARN}'
      value: '80'
      description: Memory usage warning threshold (%).
    - macro: '{$UNIFI.MEM.USAGE.HIGH}'
      value: '90'
      description: Memory usage high threshold (%).
    - macro: '{$UNIFI.TEMP.WARN}'
      value: '55'
      description: Temperature warning threshold (°C).
    - macro: '{$UNIFI.TEMP.HIGH}'
      value: '65'
      description: Temperature high/critical threshold (°C).
    - macro: '{$UNIFI.UPTIME.WARN}'
      value: '24'
      description: Uptime warning threshold (hours). Fire if uptime < this value × 3600 seconds - default 24h.
    - macro: '{$UNIFI.UPS.BATTERY.WARN}'
      value: '20'
      description: UPS battery level warning threshold (%).
    - macro: '{$UNIFI.UPS.BATTERY.HIGH}'
      value: '10'
      description: UPS battery level critical threshold (%).
    - macro: '{$UNIFI.UPS.RUNTIME.HIGH}'
      value: '300'
      description: UPS battery runtime critical threshold (s). 300s = 5 minutes.

