        expression: last(/Ubiquiti UniFi RPS/unifi.rps.power.delivering.12v)>0
        name: '{HOST.NAME} RPS delivering 12V - connected device PSU failed'
        priority: DISASTER
        description: A connected device has lost its primary 12V PSU and the RPS is now supplying its power. Identify 
