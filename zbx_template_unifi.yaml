    - name: Templates
    items:
    - uuid: 4c54e7d755c04af587cfef3bf00f4585
      name: Location Latitude
      type: DEPENDENT
      key: unifi.api.host.location.lat
      delay: '0'
      history: 90d
      value_type: FLOAT
      trends: '0'
      inventory_link: LOCATION_LAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.location.lat.first()
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
    - uuid: bdaa59c4eac44be886264f9c5994d34e
      name: Location Longitude
      type: DEPENDENT
      key: unifi.api.host.location.lon
      delay: '0'
      history: 90d
      value_type: FLOAT
      trends: '0'
      inventory_link: LOCATION_LON
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.location.long.first()
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
    - uuid: 4eb9666aa10347c1828bb7dc6ca9b56c
      name: Location Name
      type: DEPENDENT
      key: unifi.api.host.location.text
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      inventory_link: LOCATION
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.location.text.first()
        error_handler: CUSTOM_VALUE
        error_handler_params: ''
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
    - uuid: 12960416c3234602a531ccb4d3b5b27a
      name: Hardware Type
      type: DEPENDENT
      key: unifi.api.host.hwtype
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      inventory_link: HARDWARE
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..reportedState.hardware.name.first()
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
    - uuid: 065c4435662d4300a7ebcc9a999ebb6b
      name: Blocked State
      type: DEPENDENT
      key: unifi.api.host.isBlocked
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..isBlocked.first()
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
      triggers:
      - uuid: 4e5e4741501646d8b806052bad5d19cf
        expression: find(/Ubiquiti UniFi API Host/unifi.api.host.isBlocked,#1,"regexp","true")=1
        name: Host is blocked by Ubiquiti
        priority: HIGH
        description: This UniFi console has been blocked in the Ubiquiti account, likely due to a billing, ToS, or 
          ownership issue. The device will not receive cloud management commands until unblocked. Log in to 
          account.ui.com to resolve.
        manual_close: 'YES'
    - uuid: 425f09b3fa0e418589feb315c0c19a53
      name: Latest Backup time
      type: DEPENDENT
      key: unifi.api.host.latestBackupTime
      delay: '0'
      history: 90d
      trends: '0'
      units: unixtime
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..latestBackupTime.first()
      - type: JAVASCRIPT
        parameters:
        - |
          var date = new Date(value);
          return Math.floor(date.getTime() / 1000);
      master_item:
        key: unifi.api.hosts
      tags:
      - tag: component
        value: Unifi Gateway
      triggers:
      - uuid: 5d9ac579a04d48fdac3eef43c738d3be
        expression: fuzzytime(/Ubiquiti UniFi API Host/unifi.api.host.latestBackupTime,{$BACKUP_INTERVAL})=0
        name: No backup within expected interval ({$BACKUP_INTERVAL})
        priority: AVERAGE
        description: The last recorded backup is older than the {$BACKUP_INTERVAL} threshold. Set this to 1 day beyond 
          your configured backup schedule (Settings > System > Backups). Daily=2d, Weekly=8d, Monthly=32d. Manual close 
          once confirmed or backup manually triggered.
        manual_close: 'YES'
    - uuid: e4044d85dde243ddae2066de22a02764
      name: Public IP Address
      type: DEPENDENT
      key: unifi.api.host.publicip
      delay: '0'
      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
