    - uuid: f3b3e5cd72fb414baaa325932608fbc6
      name: Discover Host WAN Interfaces
      type: DEPENDENT
      key: unifi.discover.host.wans
      delay: '0'
      item_prototypes:
      - uuid: de02599ea8f64e66aae54d6315c96296
        name: '{#WANID} Uptime'
        type: DEPENDENT
        key: unifi.api.host.wan.uptime[{#WANID}]
        delay: '0'
        value_type: FLOAT
        units: '%'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var wanId = '{#WANID}';
            var d = JSON.parse(value).health;
            var wan = (d.data || []).filter(function(s){ return s.subsystem === 'wan'; })[0] || {};
            var stats = (wan.uptime_stats || {})[wanId] || {};
            return stats.availability !== undefined ? stats.availability : 100;
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 5m
        master_item:
          key: unifi.local.all
        tags:
        - tag: component
          value: wan
        - tag: wan
          value: '{#WANID}'
        trigger_prototypes:
        - uuid: 005e0b39943147c1a0650b5c6140a817
          expression: last(/Ubiquiti UniFi API Host/unifi.api.host.wan.uptime[{#WANID}])=0 and
            {$UNIFI.WAN.ENABLED:"{#WANID}"}=1
          name: '{#WANID} availability is 0% (completely down over measurement window) on {HOST.NAME}'
          priority: HIGH
          description: The {#WANID} circuit has 0% availability over the current measurement window - it has been
            continuously down. Raised alongside the sustained-downtime trigger. To suppress for a WAN intentionally
            offline on a specific host, set host macro {$UNIFI.WAN.ENABLED:WAN2}=0.
          manual_close: 'YES'
        - uuid: 78306793ad3046a5a47e716751a12f43
          expression: last(/Ubiquiti UniFi API Host/unifi.api.host.wan.uptime[{#WANID}])<{$WAN_UPTIME_WARN} and
            last(/Ubiquiti UniFi API Host/unifi.api.host.wan.uptime[{#WANID}])>0 and
            {$UNIFI.WAN.ENABLED:"{#WANID}"}=1
          name: '{#WANID} 24h availability degraded: {ITEM.LASTVALUE}% on {HOST.NAME}'
          priority: AVERAGE
          description: '{#WANID} availability over the last 24h has dropped below {$WAN_UPTIME_WARN}%. This means the
            circuit has experienced meaningful outage time in the past day. Check downtime period triggers for detail.'
        - uuid: 2dadf85a087d4a4089ea6060f23e4893
          expression: last(/Ubiquiti UniFi API Host/unifi.api.host.wan.uptime[{#WANID}])<{$WAN_UPTIME_NOTICE} and
            last(/Ubiquiti UniFi API Host/unifi.api.host.wan.uptime[{#WANID}])>={$WAN_UPTIME_WARN} and
            {$UNIFI.WAN.ENABLED:"{#WANID}"}=1
          name: '{#WANID} 24h availability slightly below target: {ITEM.LASTVALUE}% on {HOST.NAME}'
          priority: WARNING
          description: '{#WANID} availability over the last 24h is between {$WAN_UPTIME_WARN}% and
            {$WAN_UPTIME_NOTICE}%. The circuit is mostly up but has had brief interruptions.'
      - uuid: 7b0c5d121d234dbd9e7a30cdbb64453b
        name: '{#WANID} Downtime Periods (recent)'
        type: DEPENDENT
        key: unifi.api.host.wan.downtimeCount[{#WANID}]
        delay: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.data[?(@.hostId=='{$HOSTID}')].statistics.wans.{#WANID}.wanIssues.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '[]'
        - type: JAVASCRIPT
          parameters:
          - |
            var arr = JSON.parse(value);
            var recent = arr.slice(-3);
            return recent.filter(function(i){return i.wanDowntime===true;}).length;
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 5m
        master_item:
          key: unifi.api.host.sites
        tags:
        - tag: component
          value: wan
        - tag: wan
          value: '{#WANID}'
        trigger_prototypes:
        - uuid: 194cfd2daabe416bbd29ec32f465a7b4
          expression: last(/Ubiquiti UniFi API Host/unifi.api.host.wan.downtimeCount[{#WANID}])>=3
          name: '{#WANID} sustained downtime on {HOST.NAME} - {ITEM.LASTVALUE}/3 recent periods'
          priority: HIGH
          description: '{#WANID} has been down in all 3 of the most recent measurement periods (~15-20 min). This circuit
            is currently failing. Check physical connection and ISP status.'
        - uuid: 204339270a15409cbc7c85fd1e7dfa3a
          expression: last(/Ubiquiti UniFi API Host/unifi.api.host.wan.downtimeCount[{#WANID}])=2
          name: '{#WANID} intermittent downtime on {HOST.NAME} - {ITEM.LASTVALUE}/3 recent periods'
          priority: AVERAGE
          description: '{#WANID} experienced downtime in 2 of the last 3 measurement periods. Monitor for escalation. Check
            ISP line quality.'
      - uuid: ca89c956113d4379a089d588b4d762fa
        name: '{#WANID} Packet Loss Periods (recent)'
        type: DEPENDENT
        key: unifi.api.host.wan.packetLossCount[{#WANID}]
        delay: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.data[?(@.hostId=='{$HOSTID}')].statistics.wans.{#WANID}.wanIssues.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '[]'
        - type: JAVASCRIPT
          parameters:
          - |
            var arr = JSON.parse(value);
            var recent = arr.slice(-3);
            return recent.filter(function(i){return i.packetLoss===true;}).length;
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 5m
        master_item:
          key: unifi.api.host.sites
        tags:
        - tag: component
          value: wan
        - tag: wan
          value: '{#WANID}'
        trigger_prototypes:
        - uuid: 2e912ce371ba439d8a66ca6bd9021ee2
          expression: last(/Ubiquiti UniFi API Host/unifi.api.host.wan.packetLossCount[{#WANID}])>=2
          name: '{#WANID} packet loss in {ITEM.LASTVALUE}/3 recent periods on {HOST.NAME}'
          priority: WARNING
          description: '{#WANID} has reported packet loss in 2 or more of the last 3 measurement periods. Line quality is
            degraded. Check ISP status and cable integrity.'
      - uuid: 7a5d1b0dda8f4134ab0adf4e8c6ff7ca
        name: '{#WANID} Latency'
        type: DEPENDENT
        key: unifi.api.host.wan.latencyMs[{#WANID}]
        delay: '0'
        units: ms
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var wanId = '{#WANID}';
            var d = JSON.parse(value).health;
            var wan = (d.data || []).filter(function(s){ return s.subsystem === 'wan'; })[0] || {};
            var stats = (wan.uptime_stats || {})[wanId] || {};
            return stats.latency_average !== undefined ? stats.latency_average : 0;
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 5m
        master_item:
          key: unifi.local.all
        tags:
        - tag: component
          value: wan
        - tag: wan
          value: '{#WANID}'
        trigger_prototypes:
        - uuid: 992ddb00b63f429d8567e4364988fc07
          expression: last(/Ubiquiti UniFi API Host/unifi.api.host.wan.latencyMs[{#WANID}])>{$UNIFI.WAN.LATENCY.WARN} and 
            last(/Ubiquiti UniFi API Host/unifi.api.host.wan.latencyMs[{#WANID}])>0
          name: '{#WANID} high latency: {ITEM.LASTVALUE}ms on {HOST.NAME}'
          priority: WARNING
          description: '{#WANID} current average latency exceeds {$UNIFI.WAN.LATENCY.WARN}ms. For sites in Central America, latency
            of 60-80ms to a UK hub is normal - raise {$UNIFI.WAN.LATENCY.WARN} on those hosts to avoid false positives.'
      - uuid: b6204a2dc9374ad5928c5fd322874ead
        name: '{#WANID} External IP'
        type: DEPENDENT
        key: unifi.api.host.wan.externalIp[{#WANID}]
        delay: '0'
        value_type: TEXT
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.data[?(@.hostId=='{$HOSTID}')].statistics.wans.{#WANID}.externalIp.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: ''
        - type: REGEX
          parameters:
          - \d+\.\d+\.\d+\.\d+
          - \0
          error_handler: DISCARD_VALUE
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: unifi.api.host.sites
        tags:
        - tag: component
          value: wan
        - tag: wan
          value: '{#WANID}'
        trigger_prototypes:
        - uuid: aba356b51956406094da45d11d57291d
          expression: change(/Ubiquiti UniFi API Host/unifi.api.host.wan.externalIp[{#WANID}])=1
          name: '{#WANID} external IP changed to {ITEM.LASTVALUE} on {HOST.NAME}'
          priority: INFO
          manual_close: 'YES'
          description: The external (ISP-visible) IP address for {#WANID} has changed. This is expected on dynamic 
            connections. If this WAN is configured with a static IP, investigate with the ISP - it may indicate an 
            unplanned circuit change.
      master_item:
        key: unifi.api.host.sites
      lld_macro_paths:
      - lld_macro: '{#WANID}'
        path: $.wanId
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var hostId = '{$HOSTID}';
          var site = {};
          for (var i = 0; i < (d.data || []).length; i++) {
              if (d.data[i].hostId === hostId) { site = d.data[i]; break; }
          }
          var wans = (site.statistics || {}).wans || {};
          return JSON.stringify(Object.keys(wans).map(function(k){ return {wanId: k}; }));
    - uuid: 38699bcb6b974a9d85a9ff222794fed8
      name: Discover Host UAP Devices
      type: DEPENDENT
      key: unifi.discover.host.devices.uap
      delay: '0'
      filter:
        conditions:
        - macro: '{#SHORTNAME}'
          value: UAP|U[0-9]|U7|UAPL|UDRULT|UXG
          operator: MATCHES_REGEX
          formulaid: A
      host_prototypes:
      - uuid: e92fa98b8db342c594b380dd8105e1a1
        host: '{#DEVICEID}'
        name: '{#DEVICENAME} ({#MODEL})'
        group_links:
        - group:
            name: Unifi Site Hosts
        - group:
            name: Type:UnifiNetworkDevice
        - group:
            name: Type:UAP
        group_prototypes:
        - name: 'Site:{#SITENAME}'
        templates:
        - name: Ubiquiti UniFi Device
        - name: Ubiquiti UniFi UAP
        macros:
        - macro: '{$DEVICEID}'
          value: '{#DEVICEID}'
          description: Device cloud UUID
        - macro: '{$DEVICEMAC}'
          value: '{#DEVICEMAC}'
          description: Device MAC address
        - macro: '{$DEVICENAME}'
          value: '{#DEVICENAME}'
          description: Device name
        - macro: '{$MODEL}'
          value: '{#MODEL}'
          description: Device model shortname
        - macro: '{$PRODUCTLINE}'
          value: '{#PRODUCTLINE}'
          description: Device product line
        - macro: '{$HOSTID}'
          value: '{#PARENTHOSTID}'
          description: Parent gateway host ID
        - macro: '{$UNIFI.LOCAL.IP}'
          value: '{#LOCALIP}'
          description: Local controller IP
        - macro: '{$UNIFI.USERNAME}'
          value: '{#USERNAME}'
          description: Local controller username (inherited from gateway)
        - macro: '{$UNIFI.PASSWORD}'
          value: '{#PASSWORD}'
          description: Local controller password (inherited from gateway)
        custom_interfaces: 'YES'
        interfaces:
        - ip: '{#DEVICEIP}'
      master_item:
        key: unifi.api.host.devices
      lld_macro_paths:
      - lld_macro: '{#DEVICEID}'
        path: $.id
      - lld_macro: '{#DEVICEMAC}'
        path: $.mac
      - lld_macro: '{#DEVICENAME}'
        path: $.name
      - lld_macro: '{#MODEL}'
        path: $.model
      - lld_macro: '{#PRODUCTLINE}'
        path: $.productLine
      - lld_macro: '{#PARENTHOSTID}'
        path: $.parentHostId
      - lld_macro: '{#SHORTNAME}'
        path: $.shortname
      - lld_macro: '{#LOCALIP}'
        path: $.localIp
      - lld_macro: '{#DEVICEIP}'
        path: $.deviceIp
      - lld_macro: '{#USERNAME}'
        path: $.username
      - lld_macro: '{#PASSWORD}'
        path: $.password
      - lld_macro: '{#SITENAME}'
        path: $.siteName
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var hostId = '{$HOSTID}';
          var localIp = '{$UNIFI.LOCAL.IP}';
          var username = '{$UNIFI.USERNAME}';
          var password = '{$UNIFI.PASSWORD}';
          var rec = null;
          for (var i = 0; i < d.data.length; i++) {
              if (d.data[i].hostId === hostId) { rec = d.data[i]; break; }
          }
          var all = rec ? (rec.devices || []) : [];
          var devices = all.filter(function(dev) { return !dev.isConsole; });
          for (var j = 0; j < devices.length; j++) {
              devices[j].parentHostId = hostId;
              devices[j].localIp = localIp;
              devices[j].username = username;
              devices[j].password = password;
              devices[j].deviceIp = devices[j].ip || '';
              devices[j].shortname = devices[j].shortname || devices[j].model || '';
              devices[j].siteName = '{$SITENAME}';
          }
          return JSON.stringify(devices);
