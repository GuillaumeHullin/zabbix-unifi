    name: Templates
  host_groups:
  - uuid: cf0ece1934724fc29985a527d5c75864
    name: Unifi Site Hosts
  - uuid: 39316001823e4d8e96cc0d88c01e0a86
    name: Type:UnifiNetworkDevice
  - uuid: 61584d74f8b94ad8aad229bd8d1a8246
    name: Type:UAP
  - uuid: b89e72a38edc432bb5fe96ba0b9d2fe4
