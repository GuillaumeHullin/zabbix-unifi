  - uuid: ae887645c1f94cf7a5bcc02a5110494d
    template: Ubiquiti UniFi USW
    name: Ubiquiti UniFi USW
    description: Local controller polling for UniFi Switches. Applied alongside Ubiquiti UniFi Device by host prototype 
      discovery.
    groups:
    - name: Templates
    items:
    - uuid: 1b4c7a2a9e8845f5ac8bc3a05813a254
      name: USW Device Raw
      type: HTTP_AGENT
      key: unifi.usw.device
      delay: 3m
      history: '0'
      value_type: TEXT
      trends: '0'
      url: https://{$UNIFI.LOCAL.IP}/{$UNIFI.API.AUTH.URI}
      post_type: JSON
      posts: '{"username":"{$UNIFI.USERNAME}","password":"{$UNIFI.PASSWORD}"}'
      request_method: POST
      retrieve_mode: HEADERS
      timeout: 10s
      verify_peer: 'NO'
      verify_host: 'NO'
      preprocessing:
      - type: REGEX
        parameters:
        - '{$UNIFI.API.AUTH.TOKEN}=([^;]+);'
        - \1
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              var mac = '{$DEVICEMAC}';
              var url = 'https://{$UNIFI.LOCAL.IP}/{$UNIFI.API.URI}/device';
              var req = new HttpRequest();
              req.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + value);
              var resp = req.get(url);
              if (req.getStatus() !== 200) throw 'HTTP ' + req.getStatus();
              var d = JSON.parse(resp);
              var macNorm = mac.replace(/:/g,'').toLowerCase(); var dev = (d.data || []).filter(function(x) { return x.mac && x.mac.replace(/:/g,'').toLowerCase() === macNorm; });
              return JSON.stringify({data: dev});
          } catch(e) {
              Zabbix.log(4, '[UniFi USW] ' + e);
              return '{"data":[]}';
          }
      tags:
      - tag: component
        value: raw
