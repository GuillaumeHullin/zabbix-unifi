    template: Ubiquiti UniFi SD-WAN
    name: Ubiquiti UniFi SD-WAN
    description: Applied to SD-WAN config hosts discovered by Ubiquiti UniFi API. Monitors tunnel health, configuration 
      status, and WAN internet issues for each SD-WAN config via /v1/sd-wan-configs/{id}/status.
    groups:
