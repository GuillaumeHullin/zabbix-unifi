      history: 90d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.plugged
        error_handler: CUSTOM_VALUE
        error_handler_params: ''
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.local.system
      tags:
      - tag: component
        value: Shadow Mode
      triggers:
      - uuid: 85ef93cba9754be7855c854644a197b5
        expression: last(/Ubiquiti UniFi API Host/unifi.local.shadow.link)="false" and nodata(/Ubiquiti UniFi API 
          Host/unifi.local.shadow.link,5m)=0
        name: Shadow Mode link (eth6) physically disconnected - HA redundancy lost
        priority: HIGH
        description: The direct interconnect cable between the primary and standby gateway is unplugged or has failed. 
          HA failover will not work until this is restored.
        manual_close: 'YES'
        dependencies:
        - name: 'HA failover: this gateway is now STANDBY - primary has failed'
          expression: find(/Ubiquiti UniFi API Host/unifi.local.shadow.mode,#1,"regexp","STANDBY")=1
