        name: '{HOST.NAME} battery low: {ITEM.LASTVALUE} (threshold: {$UNIFI.UPS.BATTERY.WARN}%)'
        priority: WARNING
        description: The UPS battery level is below the warning threshold ({$UNIFI.UPS.BATTERY.WARN}%). If on mains power this indicates a degraded or ageing battery 
