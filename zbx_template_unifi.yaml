        description: This device has been up for less than {$UNIFI.UPTIME.WARN}h, indicating a recent unplanned or unscheduled
          reboot. Check for PoE power interruptions on the uplink switch port, a watchdog-triggered crash, or a firmware
          update that triggered a restart.
    - uuid: 8909b0926ec044cd8c850a373b3e36ab
      name: Temperature
      type: DEPENDENT
      key: unifi.rps.temperature
      delay: '0'
      history: 90d
      value_type: FLOAT
      units: °C
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].general_temperature
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: unifi.rps.device
      tags:
      - tag: component
        value: rps
      triggers:
      - uuid: eed80401d45d4838ab8d6ec5e2e27095
        expression: last(/Ubiquiti UniFi RPS/unifi.rps.temperature)>{$UNIFI.TEMP.HIGH} and last(/Ubiquiti UniFi
          RPS/unifi.rps.temperature)>0
        name: '{HOST.NAME} temperature critical: {ITEM.LASTVALUE} (threshold: {$UNIFI.TEMP.HIGH})'
        priority: HIGH
        description: The RPS chassis temperature has exceeded the critical threshold ({$UNIFI.TEMP.HIGH}°C). Fan speed should increase automatically, but if the 
          temperature continues rising the unit may shut down to protect itself. Check rack ventilation, ambient 
          temperature, and that the unit is not installed directly below heat-generating equipment.
      - uuid: 40c7871bca2e46249f2675fb2fe8239b
        expression: last(/Ubiquiti UniFi RPS/unifi.rps.temperature)>{$UNIFI.TEMP.WARN} and last(/Ubiquiti UniFi
          RPS/unifi.rps.temperature)<={$UNIFI.TEMP.HIGH}
        name: '{HOST.NAME} temperature high: {ITEM.LASTVALUE} (threshold: {$UNIFI.TEMP.WARN})'
        priority: WARNING
        description: The RPS chassis temperature is above the warning threshold ({$UNIFI.TEMP.WARN}°C). Ensure adequate rack ventilation and that the unit is 
          not installed in a poorly ventilated enclosure or directly below other heat sources.
    - uuid: f08d904229c640f8a94419e1f470c061
