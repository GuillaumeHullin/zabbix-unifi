      key: unifi.local.system
      delay: '0'
      history: '0'
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value);
          var ports = (d.system && d.system.portStatus) ? d.system.portStatus : [];
          var shadow = null;
          for (var i = 0; i < ports.length; i++) {
              if (ports[i].type === 'MGMT_SHADOW') { shadow = ports[i]; break; }
          }
          return JSON.stringify({plugged: shadow ? shadow.plugged : null});
      master_item:
        key: unifi.local.all
      tags:
      - tag: component
        value: raw
