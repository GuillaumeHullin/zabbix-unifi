  - uuid: ed8f0edb07ac4bdcbd4a698d2df76649
    template: Ubiquiti UniFi UPS
    name: Ubiquiti UniFi UPS
    description: Local controller polling for USW-Deployed-24 (USWDA) with battery backup. Applied alongside Ubiquiti 
      UniFi Device by host prototype discovery.
    groups:
    - name: Templates
    items:
    - uuid: 151d95c08de641369ab4a2edbedb5c7f
      name: UPS Device Raw
      type: HTTP_AGENT
      key: unifi.ups.device
      delay: 3m
      history: '0'
      value_type: TEXT
      trends: '0'
      url: https://{$UNIFI.LOCAL.IP}/{$UNIFI.API.AUTH.URI}
      post_type: JSON
      posts: '{"username":"{$UNIFI.USERNAME}","password":"{$UNIFI.PASSWORD}"}'
      request_method: POST
      retrieve_mode: HEADERS
      timeout: 10s
      verify_peer: 'NO'
      verify_host: 'NO'
      preprocessing:
      - type: REGEX
        parameters:
        - '{$UNIFI.API.AUTH.TOKEN}=([^;]+);'
        - \1
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              var mac = '{$DEVICEMAC}';
              var url = 'https://{$UNIFI.LOCAL.IP}/{$UNIFI.API.URI}/device';
              var req = new HttpRequest();
              req.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + value);
              var resp = req.get(url);
              if (req.getStatus() !== 200) throw 'HTTP ' + req.getStatus();
              var d = JSON.parse(resp);
              var macNorm = mac.replace(/:/g,'').toLowerCase(); var dev = (d.data || []).filter(function(x) { return x.mac && x.mac.replace(/:/g,'').toLowerCase() === macNorm; });
              return JSON.stringify({data: dev});
          } catch(e) {
              Zabbix.log(4, '[UniFi UPS] ' + e);
              return '{"data":[]}';
          }
      tags:
      - tag: component
        value: raw
    - uuid: 0ab286af12c84d95bd05be35a031ae7d
      name: State
      type: DEPENDENT
      key: unifi.ups.state
      delay: '0'
      history: 90d
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].state
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 5m
      master_item:
        key: unifi.ups.device
      tags:
      - tag: component
        value: ups
      triggers:
      - uuid: af4f82d3a48c4a42b0d2546947357f13
        expression: min(/Ubiquiti UniFi UPS/unifi.ups.state,#5)<>1
        name: '{HOST.NAME} offline - not seen by local controller'
        priority: HIGH
        dependencies:
        - name: '{HOST.NAME} is offline'
          expression: find(/Ubiquiti UniFi Device/unifi.api.device.status,#1,"regexp","offline")=1
        description: The local UniFi controller is reporting this device as offline (state ≠ 1). The device may have 
          lost power, its uplink connection, or the controller has lost management reachability. This trigger is 
          suppressed if the cloud API is also reporting the device offline, to prevent duplicate alerts.
    - uuid: 8cfbbbe2975b4d93b6b4df76cb4e044b
      name: CPU Usage
      type: DEPENDENT
      key: unifi.ups.cpu
      delay: '0'
      history: 90d
      value_type: FLOAT
      units: '%'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0]["system-stats"].cpu
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: unifi.ups.device
      tags:
      - tag: component
        value: ups
