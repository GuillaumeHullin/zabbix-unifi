        value: raw
    - uuid: 6a8a3df76868425f95f7bac84319e26d
      name: 'Unifi API Raw: Hosts'
      type: HTTP_AGENT
      key: unifi.api.hosts
      history: '0'
      value_type: TEXT
      trends: '0'
      url: https://api.ui.com/v1/hosts/{$HOSTID}
      timeout: 15s
      headers:
      - name: Accept
        value: application/json
      - name: x-api-key
        value: '{$APIKEY}'
      tags:
      - tag: component
        value: raw
    - uuid: 0603751250184046947aebb8a7f8c9c1
      name: Local Raw (Combined)
      type: HTTP_AGENT
      key: unifi.local.all
      delay: 3m
      history: '0'
      value_type: TEXT
      trends: '0'
      url: https://{$UNIFI.LOCAL.IP}/{$UNIFI.API.AUTH.URI}
      post_type: JSON
      posts: '{"username":"{$UNIFI.USERNAME}","password":"{$UNIFI.PASSWORD}"}'
      request_method: POST
      retrieve_mode: HEADERS
      timeout: 15s
      verify_peer: 'NO'
      verify_host: 'NO'
      preprocessing:
      - type: REGEX
        parameters:
        - '{$UNIFI.API.AUTH.TOKEN}=([^;]+);'
        - \1
      - type: JAVASCRIPT
        parameters:
        - |
          try {
              var token = value;
              var base = 'https://{$UNIFI.LOCAL.IP}';
              var req = new HttpRequest();
              req.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + token);
              var health = req.get(base + '/{$UNIFI.API.URI}/health');
              if (req.getStatus() !== 200) throw 'health HTTP ' + req.getStatus();
              req.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + token);
              var device = req.get(base + '/{$UNIFI.API.URI}/device');
              if (req.getStatus() !== 200) throw 'device HTTP ' + req.getStatus();
              req.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + token);
              var shadow = req.get(base + '/{$UNIFI.API.REST.URI}/setting/shadow_mode');
              if (req.getStatus() !== 200) shadow = '{"data":[{}]}';
              req.addHeader('Cookie: {$UNIFI.API.AUTH.TOKEN}=' + token);
              var system = req.get(base + '/api/system');
              if (req.getStatus() !== 200) system = '{"portStatus":[]}';
              return JSON.stringify({
                  health: JSON.parse(health),
                  device: JSON.parse(device),
                  shadow: JSON.parse(shadow),
                  system: JSON.parse(system)
              });
          } catch(e) {
              Zabbix.log(4, '[UniFi local.all] ' + e);
              return '{"health":{"data":[]},"device":{"data":[]},"shadow":{"data":[{}]},"system":{"portStatus":[]}}';
          }
      tags:
      - tag: component
        value: raw
